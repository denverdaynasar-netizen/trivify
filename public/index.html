<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivify - Live Interactive Event Trivia</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body style="align-items:center; justify-content:center;">

  <div class="player-login-box" style="max-width:540px; padding:3rem 2.5rem;">
    <img src="/assets/logo.jpg" alt="B & S Logo" class="brand-logo" style="width:110px; height:110px; margin:0 auto 1.5rem; display:block;">
    <div style="font-size:0.85rem; letter-spacing:0.25em; text-transform:uppercase; color:var(--gold); font-weight:900; margin-bottom:0.3rem;">TRIVIFY</div>
    <h1 style="font-family:var(--font-serif); font-size:2.1rem; color:var(--gold-light); margin-bottom:0.4rem;">B & S Wedding</h1>
    <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:2.2rem;">Live Interactive Event Trivia</p>

    <div style="display:flex; flex-direction:column; gap:1rem;">
      <a href="/play" class="btn-primary" style="text-decoration:none; display:flex; align-items:center; justify-content:center; gap:0.5rem; padding:1.1rem;">
        📱 Join Game as Player
      </a>
      <a href="/host" class="btn-primary" style="text-decoration:none; background:rgba(255,255,255,0.08); border:1px solid var(--border-glass); color:#fff; display:flex; align-items:center; justify-content:center; gap:0.5rem; padding:1.1rem;">
        🖥️ Open Host Screen (Projector / TV)
      </a>
    </div>
  </div>

</body>
</html>
